name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build installDist bundledDistTar --continue
      - run: python3 tui/drive.py
      # bin/tui names bin/runtime from its own APP_HOME, resolved through links, so a launcher
      # linked from elsewhere still starts its own tree's Runtime. That Runtime's refusal to start
      # without credentials is the proof it was the one started.
      - name: A linked bin/tui starts its own tree's Runtime
        run: |
          for name in plain 'tree with spaces "quotes" and \backslash'; do
            launcher_home=$(mktemp -d)
            cp -a "$PWD/build/install/proxenos" "$launcher_home/$name"
            ln -s "$launcher_home/$name/bin/tui" "$launcher_home/tui"
            out=$(env -i HOME="$launcher_home" XDG_RUNTIME_DIR="$launcher_home" PATH=/usr/bin:/bin JAVA_HOME="$JAVA_HOME" "$launcher_home/tui" start 2>&1) || true
            echo "$out"
            grep -q "No credentials file" <<<"$out"
            rm -rf "$launcher_home"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: "**/build/test-results/test/*.xml"
