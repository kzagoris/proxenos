name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build installDist bundledDistTar --continue
      - run: python3 tui/drive.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: "**/build/test-results/test/*.xml"
